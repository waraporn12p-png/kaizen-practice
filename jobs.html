<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการงานซ่อม</title>
    <style>
      body { font-family: sans-serif; padding: 12px; }
      .table-wrap { overflow-x: auto; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #ccc; padding: 6px; font-size: 14px; white-space: nowrap; }
      th { background: #f0f0f0; }
      input[type=file] { max-width: 180px; }
    </style>
  </head>
  <body>
    <h1>รายการงานซ่อม</h1>
    <button id="reloadBtn">🔄 โหลดใหม่</button>
    <a href="index.html">+ แจ้งซ่อมใหม่</a>
    <p id="msg"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>เลขงาน</th><th>วันที่</th><th>ผู้แจ้ง</th><th>อุปกรณ์</th>
            <th>สถานที่</th><th>อาการ</th><th>สถานะ</th><th></th>
            <th>รูป After</th><th>แนบรูป</th>
          </tr>
        </thead>
        <tbody id="jobList"></tbody>
      </table>
    </div>

    <script>
      const API_URL = 'https://script.google.com/macros/s/AKfycby4Vc6jrYgZbBf45Wpto7LYTRP3Opsz6nGJLr3fEtqb-nDd9Hi4G6rSVdFft4SDdS2e/exec';
      const STATUSES = ['รออนุมัติ', 'อนุมัติ', 'ไม่อนุมัติ', 'กำลังซ่อม', 'เสร็จแล้ว'];

      const jobList = document.getElementById('jobList');
      const msg = document.getElementById('msg');

      // ===== ตัวช่วย: ส่งคำสั่ง POST ไป Apps Script =====
      async function postToApi(payload) {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (!result.ok) throw new Error(result.error);
        return result;
      }

      // ===== 1) โหลดรายการงาน =====
      async function loadJobs() {
        msg.textContent = '⏳ กำลังโหลด...';
        try {
          const res = await fetch(API_URL);
          const result = await res.json();
          if (!result.ok) throw new Error(result.error);
          renderJobs(result.data);
          msg.textContent = 'ทั้งหมด ' + result.data.length + ' งาน';
        } catch (err) {
          msg.textContent = '❌ โหลดไม่สำเร็จ: ' + err.message;
        }
      }

      // ===== 2) สร้างแถวในตาราง =====
      function renderJobs(jobs) {
        jobList.innerHTML = '';
        jobs.forEach(job => {
          const tr = document.createElement('tr');

          [job.id, job.timestamp, job.reporter, job.equipment, job.location, job.detail]
            .forEach(text => {
              const td = document.createElement('td');
              td.textContent = text;
              tr.appendChild(td);
            });

          // Dropdown สถานะ
          const tdStatus = document.createElement('td');
          const select = document.createElement('select');
          STATUSES.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            if (s === job.status) opt.selected = true;
            select.appendChild(opt);
          });
          tdStatus.appendChild(select);
          tr.appendChild(tdStatus);

          // ปุ่มบันทึกสถานะ
          const tdBtn = document.createElement('td');
          const btn = document.createElement('button');
          btn.textContent = 'บันทึก';
          btn.addEventListener('click', () => updateStatus(job.id, select.value, btn));
          tdBtn.appendChild(btn);
          tr.appendChild(tdBtn);

          // ลิงก์ดูรูป (แสดงเฉพาะลิงก์ของ Google Drive)
          const tdPhoto = document.createElement('td');
          if (typeof job.photoUrl === 'string' && job.photoUrl.startsWith('https://drive.google.com/')) {
            const a = document.createElement('a');
            a.href = job.photoUrl;
            a.target = '_blank';
            a.textContent = '📷 ดูรูป';
            tdPhoto.appendChild(a);
          } else {
            tdPhoto.textContent = '-';
          }
          tr.appendChild(tdPhoto);

          // เลือกรูป + ปุ่มอัปโหลด
          const tdUpload = document.createElement('td');
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = 'image/*';      // มือถือจะมีตัวเลือก "ถ่ายรูป"
          const upBtn = document.createElement('button');
          upBtn.textContent = 'อัปโหลด';
          upBtn.addEventListener('click', () => uploadPhoto(job.id, fileInput, upBtn));
          tdUpload.appendChild(fileInput);
          tdUpload.appendChild(upBtn);
          tr.appendChild(tdUpload);

          jobList.appendChild(tr);
        });
      }

      // ===== 3) เปลี่ยนสถานะ =====
      async function updateStatus(id, status, btn) {
        btn.disabled = true;
        btn.textContent = '⏳';
        try {
          await postToApi({ action: 'updateStatus', id: id, status: status });
          msg.textContent = '✅ ' + id + ' → ' + status;
        } catch (err) {
          msg.textContent = '❌ ' + err.message;
        } finally {
          btn.disabled = false;
          btn.textContent = 'บันทึก';
        }
      }

      // ===== 4) ย่อรูปให้เล็กลง แล้วแปลงเป็นข้อความ (base64) =====
      function resizeImage(file, maxSize = 1280, quality = 0.8) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > h && w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
            else if (h > maxSize)      { w = Math.round(w * maxSize / h); h = maxSize; }

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(img.src);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve(dataUrl.split(',')[1]);   // เอาเฉพาะส่วนข้อมูลรูป
          };
          img.onerror = () => reject(new Error('อ่านไฟล์รูปไม่ได้'));
          img.src = URL.createObjectURL(file);
        });
      }

      // ===== 5) อัปโหลดรูป =====
      async function uploadPhoto(id, fileInput, btn) {
        const file = fileInput.files[0];
        if (!file) {
          msg.textContent = '⚠️ กรุณาเลือกรูปก่อนกดอัปโหลด';
          return;
        }
        btn.disabled = true;
        btn.textContent = '⏳';
        msg.textContent = '⏳ กำลังอัปโหลดรูปของ ' + id + '...';
        try {
          const base64 = await resizeImage(file);
          await postToApi({ action: 'uploadPhoto', id: id, mimeType: 'image/jpeg', data: base64 });
          msg.textContent = '✅ อัปโหลดรูปของ ' + id + ' แล้ว';
          loadJobs();   // โหลดตารางใหม่ให้เห็นลิงก์
        } catch (err) {
          msg.textContent = '❌ ' + err.message;
        } finally {
          btn.disabled = false;
          btn.textContent = 'อัปโหลด';
        }
      }

      document.getElementById('reloadBtn').addEventListener('click', loadJobs);
      loadJobs();
    </script>
  </body>
</html>
