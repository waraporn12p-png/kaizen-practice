<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการงานซ่อม</title>
       <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap">
    <link rel="stylesheet" href="style.css">  </head>
  <body>
    <h1>รายการงานซ่อม</h1>

    <!-- กล่องเข้าสู่ระบบ -->
    <div id="loginBox" class="box">
      <b>เข้าสู่ระบบ (หัวหน้า / ช่าง)</b><br><br>
      <input type="password" id="pin" placeholder="ใส่ PIN" inputmode="numeric">
      <button id="loginBtn">เข้าสู่ระบบ</button>
      <p><small>ไม่ใส่ PIN = ดูรายการได้อย่างเดียว</small></p>
    </div>

    <!-- แถบแสดงผู้ใช้ -->
    <div id="userBar" class="box hidden">
      เข้าสู่ระบบเป็น: <b id="roleName"></b>
      <button id="logoutBtn">ออกจากระบบ</button>
    </div>

    <button id="reloadBtn">🔄 โหลดใหม่</button>
    <a href="index.html">+ แจ้งซ่อมใหม่</a>
    <p id="msg"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>เลขงาน</th><th>วันที่</th><th>ผู้แจ้ง</th><th>อุปกรณ์</th>
            <th>สถานที่</th><th>อาการ</th><th>สถานะ</th>
            <th>ดำเนินการ</th><th>รูป After</th>
          </tr>
        </thead>
        <tbody id="jobList"></tbody>
      </table>
    </div>

    <script>
      const API_URL = 'https://script.google.com/macros/s/AKfycby4Vc6jrYgZbBf45Wpto7LYTRP3Opsz6nGJLr3fEtqb-nDd9Hi4G6rSVdFft4SDdS2e/exec';

      // ต้องตรงกับ Backend (ใช้แค่ซ่อน/แสดงปุ่ม ส่วนการตรวจจริงอยู่ที่ Backend)
      const TRANSITIONS = {
        supervisor: { 'รออนุมัติ': ['อนุมัติ', 'ไม่อนุมัติ'] },
        technician: { 'อนุมัติ': ['กำลังซ่อม'], 'กำลังซ่อม': ['เสร็จแล้ว'] }
      };
      const ROLE_NAMES = { supervisor: 'หัวหน้า', technician: 'ช่าง' };
      const STATUS_CLASS = {
        'รออนุมัติ': 'wait', 'อนุมัติ': 'ok', 'ไม่อนุมัติ': 'no',
        'กำลังซ่อม': 'doing', 'เสร็จแล้ว': 'done'
      };

      let currentRole = null;
      let currentPin = '';

      const jobList = document.getElementById('jobList');
      const msg = document.getElementById('msg');

      // ===== ตัวช่วยส่ง POST =====
      async function postToApi(payload) {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (!result.ok) throw new Error(result.error);
        return result;
      }

      // ===== แสดง/ซ่อน กล่องเข้าสู่ระบบ =====
      function showUser() {
        document.getElementById('loginBox').classList.toggle('hidden', !!currentRole);
        document.getElementById('userBar').classList.toggle('hidden', !currentRole);
        document.getElementById('roleName').textContent = currentRole ? ROLE_NAMES[currentRole] : '';
      }

      // ===== เข้าสู่ระบบ =====
      async function login() {
        const pin = document.getElementById('pin').value.trim();
        if (!pin) { msg.textContent = '⚠️ กรุณาใส่ PIN'; return; }
        msg.textContent = '⏳ กำลังตรวจสอบ...';
        try {
          const result = await postToApi({ action: 'login', pin: pin });
          currentRole = result.role;
          currentPin = pin;
          document.getElementById('pin').value = '';
          showUser();
          loadJobs();
        } catch (err) {
          msg.textContent = '❌ ' + err.message;
        }
      }

      function logout() {
        currentRole = null;
        currentPin = '';
        showUser();
        loadJobs();
      }

      // ===== โหลดรายการงาน =====
      async function loadJobs() {
        msg.textContent = '⏳ กำลังโหลด...';
        try {
          const res = await fetch(API_URL);
          const result = await res.json();
          if (!result.ok) throw new Error(result.error);
          renderJobs(result.data);
          msg.textContent = 'ทั้งหมด ' + result.data.length + ' งาน';
        } catch (err) {
          msg.textContent = '❌ โหลดไม่สำเร็จ: ' + err.message;
        }
      }

      // ===== สร้างตาราง =====
      function renderJobs(jobs) {
        jobList.innerHTML = '';
        jobs.forEach(job => {
          const tr = document.createElement('tr');

          [job.id, job.timestamp, job.reporter, job.equipment, job.location, job.detail, job.status]
            .forEach(text => {
              const td = document.createElement('td');
              td.textContent = text;
              tr.appendChild(td);
            });
          // เปลี่ยนช่องสถานะเป็นป้ายสี
          const statusTd = tr.lastChild;
          statusTd.textContent = '';
          const badge = document.createElement('span');
          badge.className = 'badge ' + (STATUS_CLASS[job.status] || '');
          badge.textContent = job.status;
          statusTd.appendChild(badge);
          // ช่องดำเนินการ: แสดงเฉพาะปุ่มที่บทบาทนี้กดได้
          const tdAction = document.createElement('td');
          const nextList = currentRole ? (TRANSITIONS[currentRole][job.status] || []) : [];
          nextList.forEach(next => {
            const b = document.createElement('button');
            b.textContent = next;
            b.addEventListener('click', () => updateStatus(job.id, next, b));
            tdAction.appendChild(b);
          });

          // ช่างแนบรูปได้
          if (currentRole === 'technician') {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            const upBtn = document.createElement('button');
            upBtn.textContent = '📷 อัปโหลด';
            upBtn.addEventListener('click', () => uploadPhoto(job.id, fileInput, upBtn));
            tdAction.appendChild(document.createElement('br'));
            tdAction.appendChild(fileInput);
            tdAction.appendChild(upBtn);
          }

          if (!tdAction.hasChildNodes()) tdAction.textContent = '-';
          tr.appendChild(tdAction);

          // ลิงก์รูป
          const tdPhoto = document.createElement('td');
          if (typeof job.photoUrl === 'string' && job.photoUrl.startsWith('https://drive.google.com/')) {
            const a = document.createElement('a');
            a.href = job.photoUrl;
            a.target = '_blank';
            a.textContent = '📷 ดูรูป';
            tdPhoto.appendChild(a);
          } else {
            tdPhoto.textContent = '-';
          }
          tr.appendChild(tdPhoto);

          jobList.appendChild(tr);
        });
      }

      // ===== เปลี่ยนสถานะ =====
      async function updateStatus(id, status, btn) {
        btn.disabled = true;
        try {
          await postToApi({ action: 'updateStatus', id: id, status: status, pin: currentPin });
          msg.textContent = '✅ ' + id + ' → ' + status;
          loadJobs();
        } catch (err) {
          msg.textContent = '❌ ' + err.message;
          btn.disabled = false;
        }
      }

      // ===== ย่อรูป =====
      function resizeImage(file, maxSize = 1280, quality = 0.8) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > h && w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
            else if (h > maxSize)      { w = Math.round(w * maxSize / h); h = maxSize; }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(img.src);
            resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
          };
          img.onerror = () => reject(new Error('อ่านไฟล์รูปไม่ได้'));
          img.src = URL.createObjectURL(file);
        });
      }

      // ===== อัปโหลดรูป =====
      async function uploadPhoto(id, fileInput, btn) {
        const file = fileInput.files[0];
        if (!file) { msg.textContent = '⚠️ กรุณาเลือกรูปก่อน'; return; }
        btn.disabled = true;
        msg.textContent = '⏳ กำลังอัปโหลดรูปของ ' + id + '...';
        try {
          const base64 = await resizeImage(file);
          await postToApi({ action: 'uploadPhoto', id: id, mimeType: 'image/jpeg', data: base64, pin: currentPin });
          msg.textContent = '✅ อัปโหลดรูปของ ' + id + ' แล้ว';
          loadJobs();
        } catch (err) {
          msg.textContent = '❌ ' + err.message;
          btn.disabled = false;
        }
      }

      document.getElementById('loginBtn').addEventListener('click', login);
      document.getElementById('logoutBtn').addEventListener('click', logout);
      document.getElementById('reloadBtn').addEventListener('click', loadJobs);
      showUser();
      loadJobs();
    </script>
  </body>
</html>
